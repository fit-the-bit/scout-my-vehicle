[variables]
PYTHONPATH = "/app:."

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "python -m pip install --no-cache-dir -r requirements.txt",
  "python -c 'import site, pathlib; [pathlib.Path(p).joinpath(\"scoutmycar.pth\").write_text(\"/app\\n.\\n\") for p in site.getsitepackages() if pathlib.Path(p).is_dir()]'"
]

[start]
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir /app"
