<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .title-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 104px;
        font-weight: 900;
        letter-spacing: -0.015em;
        fill: #0f172a;
      }
      .red-accent {
        fill: #c0262b;
      }
      .tagline-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 0.05em;
        fill: #1e293b;
      }
      .pipe-accent {
        fill: #c0262b;
        font-weight: 900;
      }
    </style>
  </defs>

  <!-- Centered Logo Group -->
  <g transform="translate(512, 490)" text-anchor="middle">
    <!-- Brand Name: ScoutMyVehicle -->
    <text class="title-text" y="0">
      <tspan class="red-accent">S</tspan><tspan>cout</tspan><tspan class="red-accent">M</tspan><tspan>y</tspan><tspan class="red-accent">V</tspan><tspan>ehicle</tspan>
    </text>

    <!-- Tagline: FIND | VERIFY | DRIVE -->
    <text class="tagline-text" y="62">
      <tspan>FIND</tspan>
      <tspan dx="28" class="pipe-accent">|</tspan>
      <tspan dx="28">VERIFY</tspan>
      <tspan dx="28" class="pipe-accent">|</tspan>
      <tspan dx="28">DRIVE</tspan>
    </text>
  </g>
</svg>
